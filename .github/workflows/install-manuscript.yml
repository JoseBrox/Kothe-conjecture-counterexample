name: Install audited hybrid manuscript

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Reconstruct and install audited source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .paper-transfer/01 \
            .paper-transfer/02 \
            .paper-transfer/03 \
            .paper-transfer/04_0 \
            .paper-transfer/04_1 \
            .paper-transfer/05_0 \
            .paper-transfer/05_1 \
            .paper-transfer/06_0 \
            .paper-transfer/06_1 \
            .paper-transfer/07 \
            | base64 --decode > paper.tex.new
          echo "b0b728fdda13805997b5b9891599d11601e992e900f38117253d63ac7babc629  paper.tex.new" | sha256sum -c -
          mv paper.tex.new paper.tex
          cp .paper-transfer/README.new README.md
          cp .paper-transfer/PROVENANCE.new PROVENANCE.md
          rm -rf .paper-transfer
          rm .github/workflows/install-manuscript.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install audited hybrid manuscript"
          git push origin HEAD:main
