name: Build manuscript

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile manuscript
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b
        with:
          root_file: paper.tex
          texlive_version: 2026

      - name: Upload compiled PDF
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: paper-pdf
          path: paper.pdf
          if-no-files-found: error

  publish-pdf:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download compiled PDF
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: paper-pdf
          path: ${{ runner.temp }}/paper-artifact

      - name: Publish generated PDF branch
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/paper-artifact/paper.pdf" "${RUNNER_TEMP}/paper.pdf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan generated
          cp "${RUNNER_TEMP}/paper.pdf" paper.pdf
          cat > README.md <<EOF
          # Generated manuscript

          This branch is generated automatically from commit \`${GITHUB_SHA}\` on \`main\`.

          The source of truth is [paper.tex](https://github.com/JoseBrox/Kothe-conjecture-counterexample/blob/main/paper.tex).
          EOF
          git add paper.pdf README.md
          git commit -m "Build manuscript from ${GITHUB_SHA}"
          git push --force origin HEAD:generated
